name: Azure Static Web Apps - Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy to Azure Static Web Apps
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        # TODO: Configure this action with your Azure Static Web Apps details
        # Uncomment and fill in the details when ready to deploy
        # uses: Azure/static-web-apps-deploy@v1
        # with:
        #   azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        #   repo_token: ${{ secrets.GITHUB_TOKEN }}
        #   action: "upload"
        #   app_location: "/dist"
        #   api_location: ""
        #   output_location: ""
        run: |
          echo "Build completed successfully"
          echo "To enable Azure deployment:"
          echo "1. Create an Azure Static Web App (Free tier)"
          echo "2. Add AZURE_STATIC_WEB_APPS_API_TOKEN to repository secrets"
          echo "3. Uncomment the Azure deployment step in this workflow"
          echo "4. Update app_location to point to your build output (dist)"
