# https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning
name: "CodeQL Advanced"

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 22 * * 5'

jobs:
  has-changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      actions-files-changed: steps.action-changes.outputs.files-changed

    steps:      
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Has Actions changes
      id: action-changes
      uses: ./.github/actions/get-changed-files
      with:
        file-grep: '\.github/.*'

  analyze-actions:
    name: 'Analyze: Actions'
    runs-on: ubuntu-latest
    needs: has-changes
    if: needs.has-changes.outputs.actions-files-changed == 'true'
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: actions
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:actions"

  analyze-js-ts:
    name: 'Analyze: JS/TS'
    runs-on: ubuntu-latest
    needs: has-changes
    if: needs.has-changes.outputs.actions-files-changed != 'true'
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: javascript-typescript
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:javascript-typescript"