# https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning
name: 'CodeQL Advanced - JS/TS'

on:
  pull_request:
    branches: ['main']
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

jobs:
  analyze-js-ts:
    name: 'Analyze: JS/TS'
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

      # required to inspect the PR's changed files
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Check for JS/TS changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr diff "${{ github.event.pull_request.number }}" --name-only \
            | grep -qE '\.(ts|tsx|js|jsx|json)$|(^|/)\.npmrc$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # github/codeql-action/init@v4.37.7
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # github/codeql-action/analyze@v4.37.7
        with:
          category: '/language:javascript-typescript'

      - name: Upload empty results (no relevant changes)
        if: github.event_name == 'pull_request' && steps.changes.outputs.relevant == 'false'
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: .github/codeql/empty-results.sarif
          category: '/language:javascript-typescript'
