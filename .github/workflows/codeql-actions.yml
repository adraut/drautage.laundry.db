# https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning
name: 'CodeQL Advanced - Actions'

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/**'
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

jobs:
  analyze-actions:
    name: 'Analyze: Actions'
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # github/codeql-action/analyze@v4
        with:
          category: '/language:actions'
