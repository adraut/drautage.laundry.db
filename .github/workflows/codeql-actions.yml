# https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning
name: 'CodeQL Advanced - Actions'

on:
  pull_request:
    branches: ['main']
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

jobs:
  analyze-actions:
    name: 'Analyze: Actions'
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

      # required to inspect the PR's changed files
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Check for Actions changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr diff "${{ github.event.pull_request.number }}" --name-only \
            | grep -qE '^\.github/'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # github/codeql-action/init@v4.37.4
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # github/codeql-action/analyze@v4.37.4
        with:
          category: '/language:actions'

      - name: Upload empty results (no relevant changes)
        if: github.event_name == 'pull_request' && steps.changes.outputs.relevant == 'false'
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: .github/codeql/empty-results.sarif
          category: '/language:actions'
