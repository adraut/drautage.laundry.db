# https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning
name: 'CodeQL Advanced - Actions'

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/**'
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

jobs:
  analyze-actions:
    name: 'Analyze: Actions'
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # github/codeql-action/init@v4.37.4
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # github/codeql-action/analyze@v4.37.4
        with:
          category: '/language:actions'
